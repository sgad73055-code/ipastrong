name: Add app from link (automatic)

on:
  workflow_dispatch:
    inputs:
      url:
        description: Direct public HTTPS IPA download URL
        required: true
        type: string
      name:
        description: App name (optional)
        required: false
        type: string
      description:
        description: Description (optional)
        required: false
        type: string
      icon:
        description: Public HTTPS icon URL (optional)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ipa-strong-import-review
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify importer
        run: python3 add_app_from_url.py --self-test
      - name: Validate source before changing anything
        run: |
          python3 - <<'PY'
          import json
          import source_guard
          with open('ipastrong.json', encoding='utf-8') as f:
              source = json.load(f)
          source_guard.validate(source)
          count = len(source['apps'])
          if count < 100:
              raise SystemExit(f'Refusing to update unexpectedly small catalog: {count} apps')
          print(f'Validated existing catalog with {count} apps')
          PY
      - name: Extract IPA metadata and prepare change
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_DESCRIPTION: ${{ inputs.description }}
          APP_ICON: ${{ inputs.icon }}
        run: python3 add_app_from_url.py
      - name: Verify catalog was preserved
        run: |
          python3 - <<'PY'
          import json,subprocess
          before=json.loads(subprocess.check_output(['git','show','HEAD:ipastrong.json']))
          with open('ipastrong.json',encoding='utf-8') as f: after=json.load(f)
          previous=before['apps']
          updated=after['apps']
          if len(updated)<len(previous):
              raise SystemExit('Catalog shrank: refusing to propose update')
          original_urls={a.get('downloadURL') for a in previous}
          updated_urls={a.get('downloadURL') for a in updated}
          if not original_urls.issubset(updated_urls):
              raise SystemExit('Existing download URLs disappeared: refusing to propose update')
          print(f'Catalog preserved: {len(previous)} -> {len(updated)} apps')
          PY
      - name: Publish validated app automatically
        run: |
          set -euo pipefail
          if git diff --quiet -- ipastrong.json; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipastrong.json backups/ipastrong.last-good.json.gz
          if [ -d assets/app-icons ]; then
            git add assets/app-icons/
          fi
          git commit -m 'Automatically add validated IPA to IPA Strong'
          git push origin HEAD:main
