name: IPA Strong safe catalog preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'IPA-STORE.json'
      - 'ipastrong.json'
      - 'tools/catalog_preflight.py'
      - '.github/workflows/safe-catalog-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only catalog inspection
        run: python3 tools/catalog_preflight.py
