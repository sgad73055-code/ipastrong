name: One-time cleanup of manually added Rave

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-rave-once.yml'

permissions:
  contents: write

concurrency:
  group: ipastrong-source-writer
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Delete only the manually added Rave entry
        env:
          MANAGE_ACTION: delete
          MANAGE_TARGET: https://github.com/sgad73055-code/ipastrong/releases/download/rave/Rave.ipa
        run: python3 manage_catalog.py
      - name: Commit catalog removal and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipastrong.json catalog-owner.json backups/ipastrong.last-good.json.gz
          git rm .github/workflows/remove-rave-once.yml
          git commit -m 'Remove manually added Rave before re-import'
          git push origin HEAD:main
