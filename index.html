<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ipastrong</title>
<meta name="description" content="ipastrong IPA Library">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}.hero{padding:28px 20px;border-radius:24px;background:linear-gradient(135deg,#191d27,#10131b);border:1px solid #292e3a}
.brand{font-size:36px;font-weight:800}.sub{color:#aeb5c4;margin-top:5px}.search{width:100%;margin-top:20px;padding:15px;border-radius:15px;border:1px solid #303645;background:#151924;color:#fff;font-size:16px}
.nav{display:flex;gap:8px;overflow:auto;padding:15px 0}.nav button{border:1px solid #303645;background:#151924;color:#ddd;border-radius:12px;padding:9px 13px;white-space:nowrap}.nav .active{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.card{background:#121620;border:1px solid #272d39;border-radius:18px;padding:14px;display:flex;gap:12px}.icon{width:62px;height:62px;border-radius:15px;object-fit:cover;background:#252a36}.info{min-width:0;flex:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:12px;color:#969eae;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ver{font-size:11px;color:#737c8e;margin-top:6px}.btn{display:inline-block;margin-top:9px;padding:8px 11px;border-radius:10px;background:#fff;color:#111;font-weight:700;font-size:12px}.empty{text-align:center;color:#929aaa;padding:40px}.foot{text-align:center;color:#737c8e;padding:30px}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="brand">ipastrong</div><div class="sub">IPA Library • تطبيقات وعروض iOS</div>
<input id="search" class="search" placeholder="ابحث عن تطبيق..." autocomplete="off"></section>
<div id="nav" class="nav"></div><main id="apps" class="grid"></main><div id="empty" class="empty" hidden>ماكو نتائج.</div>
<div class="foot"><a href="offers.html">عروض الشهادات والخدمات</a>　•　<a href="https://t.me/ipastrong" target="_blank">Telegram @ipastrong</a></div>
</div>
<script>
let apps=[],cat="الكل";const $=x=>document.getElementById(x);
const name=a=>a.name||a.localizedName||"بدون اسم",icon=a=>a.iconURL||"",desc=a=>a.localizedDescription||a.subtitle||a.description||"",ver=a=>a.version||a.versionString||"",url=a=>a.downloadURL||(a.versions&&a.versions[0]&&a.versions[0].downloadURL)||"",category=a=>a.category||a.genre||"أخرى";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function nav(){let cs=["الكل",...new Set(apps.map(category).filter(Boolean))];$("nav").innerHTML=cs.slice(0,35).map(c=>`<button class="${c==cat?"active":""}" onclick='setCat(${JSON.stringify(c)})'>${esc(c)}</button>`).join("")}
function setCat(c){cat=c;nav();render()}
function render(){let q=$("search").value.trim().toLowerCase();let list=apps.filter(a=>(cat=="الكل"||category(a)==cat)&&(!q||(name(a)+" "+desc(a)+" "+category(a)).toLowerCase().includes(q)));$("apps").innerHTML=list.map(a=>`<article class="card"><img class="icon" src="${esc(icon(a))}" onerror="this.style.visibility='hidden'"><div class="info"><div class="name">${esc(name(a))}</div><div class="desc">${esc(desc(a))}</div><div class="ver">${ver(a)?"الإصدار "+esc(ver(a)):"IPA"}</div>${url(a)?`<a class="btn" href="${esc(url(a))}" target="_blank" rel="noopener">تحميل IPA</a>`:""}</div></article>`).join("");$("empty").hidden=list.length>0}
$("search").oninput=render;
fetch("ipastrong.json?v="+Date.now()).then(r=>r.json()).then(d=>{apps=Array.isArray(d.apps)?d.apps:[];nav();render()}).catch(()=>{$("empty").hidden=false;$("empty").textContent="تعذر تحميل مصدر التطبيقات."});
</script></body></html>
