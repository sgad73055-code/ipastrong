name: Add app from link

on:
  workflow_dispatch:
    inputs:
      url:
        description: Direct public HTTPS IPA download URL (required)
        required: true
        type: string
      name:
        description: App or tweak name (optional)
        required: false
        type: string
      description:
        description: Description (optional)
        required: false
        type: string
      icon:
        description: Public HTTPS icon URL (optional)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ipastrong-source-writer
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer
        run: python3 add_app_from_url.py --self-test
      - name: Download metadata and update source
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_DESCRIPTION: ${{ inputs.description }}
          APP_ICON: ${{ inputs.icon }}
        run: python3 add_app_from_url.py
      - name: Publish updated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipastrong.json backups/ipastrong.last-good.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add owner app from download link'
          git push
