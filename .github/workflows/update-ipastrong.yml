name: Update and repair IPA Strong

on:
  workflow_dispatch:
    inputs:
      action:
        description: Update or restore last-good source
        type: choice
        default: update
        options: [update, rollback]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: ipastrong-source-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test maintenance protections
        run: |
          if [ -f tests/test_source_guard.py ]; then
            python3 -m unittest discover -s tests -p 'test_source_guard.py' -v
          elif [ -f test_source_guard.py ]; then
            python3 -m unittest discover -s . -p 'test_source_guard.py' -v
          else
            echo 'Missing test_source_guard.py in tests/ or repository root'
            exit 1
          fi
      - name: Refresh and repair
        if: github.event.inputs.action != 'rollback'
        run: python3 source_guard.py --audit-limit 400
      - name: Restore last-good source
        if: github.event.inputs.action == 'rollback'
        run: python3 source_guard.py --rollback
      - name: Keep diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-diagnostics-${{ github.run_id }}
          path: source-health-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipastrong.json
          for file in source-health.json source-health-report.json backups/ipastrong.last-good.json.gz; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Maintain and verify IPA Strong source'
          git push
