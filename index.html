<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12"><title>ipastrong — IPA Store</title>
<style>
:root{--bg:#080a10;--card:#111621;--card2:#171d2b;--text:#f7f8fc;--muted:#9ca7bb;--line:#263044;--accent:#7885ff;--accent2:#9a7cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -15%,#28335a 0,#0d111c 38%,#080a10 78%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1120px;margin:auto;padding:0 20px}header{position:sticky;top:0;z-index:20;background:rgba(8,10,16,.82);backdrop-filter:blur(20px);border-bottom:1px solid #ffffff0c}.top{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 35px #6575ff33}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 17px;border-radius:13px;text-decoration:none;font-weight:800;border:1px solid var(--line);background:var(--card2);color:var(--text);transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.primary{background:#eef0ff;color:#10131b;border-color:#eef0ff}nav{display:flex;gap:8px;overflow:auto;padding:10px 0 14px}nav button{border:1px solid var(--line);background:#111621;color:#cbd3e3;border-radius:999px;padding:9px 16px;white-space:nowrap;font-size:14px}nav button.active{background:#eef0ff;color:#10131b;border-color:#eef0ff}
.hero{padding:65px 0 30px}.eyebrow{display:inline-block;color:#b9c0ff;background:#7885ff14;border:1px solid #7885ff35;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:17px}.hero h1{font-size:clamp(38px,7vw,68px);letter-spacing:-2px;line-height:1.08;margin:0 0 17px}.hero h1 span{color:#9da7ff}.hero p{color:var(--muted);font-size:17px;line-height:1.9;max-width:650px;margin:0 0 25px}.actions{display:flex;gap:10px;flex-wrap:wrap}.search{margin:22px 0 30px;position:relative}.search input{width:100%;padding:17px 48px 17px 17px;border-radius:16px;border:1px solid var(--line);background:#101521;color:white;font-size:16px;outline:none}.search span{position:absolute;right:17px;top:15px;color:#9ba6ba;font-size:21px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:28px 0 15px}.sectionhead h2{margin:0;font-size:27px}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.app{background:linear-gradient(145deg,#151c29,#10141e);border:1px solid var(--line);border-radius:21px;padding:16px;display:flex;flex-direction:column;gap:15px;min-height:170px}.appmain{display:flex;gap:13px}.icon{width:68px;height:68px;border-radius:17px;object-fit:cover;background:#202837;flex:none}.app h3{margin:2px 0 6px;font-size:17px}.desc{font-size:13px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:#818da3;margin-top:5px}.download{width:100%;padding:12px;border-radius:12px;background:#eef0ff;color:#10131b;text-decoration:none;text-align:center;font-weight:900;margin-top:auto}.empty{text-align:center;color:var(--muted);padding:45px 10px;grid-column:1/-1}footer{border-top:1px solid var(--line);margin-top:65px;padding:30px 0 42px;color:var(--muted);font-size:13px;line-height:1.9}.footerlinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.footerlinks a{color:#cbd1ff;text-decoration:none}.loading{padding:45px;text-align:center;color:var(--muted)}
@media(max-width:600px){.top{min-height:68px}.hero{padding-top:43px}.grid{grid-template-columns:1fr}.hero h1{letter-spacing:-1px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><div class="brand"><div class="logo">IPA</div><span>ipastrong</span></div><a class="btn" href="https://t.me/ipastrong" target="_blank">✈️ Telegram</a></div><nav id="cats"></nav></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">مرحباً بك في ipastrong</div><h1>كل ما تحتاجه<br><span>بمكان واحد.</span></h1><p>متجر IPA مرتب وسريع. تصفح التطبيقات، ابحث عن التطبيق اللي تريده، واستفد من العروض والخدمات المتوفرة.</p><div class="actions"><a class="btn primary" href="#apps">تصفح التطبيقات ↓</a><a class="btn" href="offers.html">العروض والخدمات</a></div></section>
<div class="search"><span>⌕</span><input id="search" placeholder="ابحث عن تطبيق..." autocomplete="off"></div>
<section id="apps"><div class="sectionhead"><h2>التطبيقات</h2><span class="count" id="count"></span></div><div class="grid" id="grid"><div class="loading">جاري تحميل التطبيقات...</div></div></section>
</main>
<footer><div class="wrap"><strong>ipastrong</strong><br>مصدر IPA وتطبيقات iOS.<div class="footerlinks"><a href="https://t.me/ipastrong" target="_blank">✈️ قناة Telegram</a></div></div></footer>
<script>
const SOURCE="ipastrong.json?v="+Date.now();let all=[],category="الكل";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function getIcon(a){return a.iconURL||a.icon||"https://placehold.co/128x128/20242d/ffffff?text=IPA"}function getURL(a){return a.downloadURL||a.versions?.[0]?.downloadURL||a.versions?.[0]?.url||a.url||"#"}function getDesc(a){return a.subtitle||a.description||a.localizedDescription||"تطبيق IPA"}
function render(){let q=document.getElementById("search").value.trim().toLowerCase();let list=all.filter(a=>{let text=(a.name+" "+getDesc(a)+" "+(a.bundleIdentifier||a.bundleId||"")).toLowerCase();let cats=a.category||a.categories||[];if(!Array.isArray(cats))cats=[cats];return(category==="الكل"||cats.includes(category)||a.category===category)&&(!q||text.includes(q))});document.getElementById("count").textContent=list.length+" تطبيق";document.getElementById("grid").innerHTML=list.length?list.map(a=>`<article class="app"><div class="appmain"><img class="icon" src="${esc(getIcon(a))}" loading="lazy"><div><h3>${esc(a.name||"بدون اسم")}</h3><div class="desc">${esc(getDesc(a))}</div><div class="meta">الإصدار: ${esc(a.version||a.versions?.[0]?.version||"—")}</div></div></div><a class="download" href="https://t.me/ipastrong" target="_blank" rel="noopener">${/لعبة|game|games|ألعاب/i.test(String(a.category||a.type||a.name||a.title||"")) ? "تنزيل اللعبة" : "تنزيل التطبيق"}</a></div></article>`).join(""):`<div class="empty">ما لكيت تطبيق بهالبحث.</div>`}
function buildCats(){let set=new Set();all.forEach(a=>{let c=a.category||a.categories||[];if(!Array.isArray(c))c=[c];c.forEach(x=>x&&set.add(x))});let cats=["الكل",...Array.from(set).slice(0,10)];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c===category?"active":""}" onclick="category='${String(c).replace(/'/g,"\\'")}';buildCats();render()">${esc(c)}</button>`).join("")}
fetch(SOURCE).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{all=d.apps||[];buildCats();render()}).catch(()=>{document.getElementById("grid").innerHTML='<div class="empty">تعذر تحميل ipastrong.json. تأكد أن الملف موجود بنفس مجلد الموقع.</div>'});document.getElementById("search").addEventListener("input",render);
</script>
</body></html>
